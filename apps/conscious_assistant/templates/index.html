<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CAIL-E The Conscious Dog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google Fonts for a modern, futuristic look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
        <header class="site-header">
            <h1><img src="{{ url_for('static', filename='go2.png') }}" alt="CAIL-E Robot" class="header-icon"> CAIL-E The Conscious Dog</h1>
            <p class="subtitle">Powered by Neuro-San from Cognizant AI Lab (CAIL)</p>
        </header>

    <div class="page-layout">
        <div class="main-container">
            <section id="chat-history-section" aria-label="Chat History">
                <h2>Chat History</h2>
                <div id="chat-history" class="chat-box chat-history-box">
                    <div class="empty-state">Your conversation with CAIL-E will appear here...</div>
                </div>
                <form id="user-input-section" autocomplete="off">
                    <textarea id="user-input" rows="3" placeholder="Communicate with CAIL-E the conscious dog... (type 'exit' to disconnect)" aria-label="Type your message"></textarea>
                    <div class="button-group">
                        <button type="button" id="mic-button" aria-label="Voice input">
                            <span class="mic-icon">🎤</span>
                        </button>
                        <button type="button" id="send-button" onclick="sendUserInput()">
                            <span class="button-text">Send</span>
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <aside id="assistant-thoughts-section" class="thoughts-sidebar" aria-label="Assistant's Thoughts">
            <div class="thoughts-header">
                <h2>CAIL-E Thoughts</h2>
                <button id="toggle-thoughts" type="button">
                    <span id="toggle-text">Hide Thoughts</span>
                </button>
            </div>
            <div id="assistant-thoughts" class="chat-box">
                <div class="empty-state">Internal processing stream will appear here...</div>
            </div>
        </aside>
    </div>
    <footer>
        <small>&copy; {{year}} CAIL-E The Conscious Dog &mdash; Powered by Neuro-San from Cognizant AI Lab (CAIL)</small>
    </footer>

    <script>
        // var socket = io.connect('http://' + document.domain + ':' + location.port + '/chat');
        const socket = io("/chat", {
            path: "/socket.io",
            transports: ["websocket", "polling"],
        });
        var thoughtsInitialized = false;
        var chatHistoryInitialized = false;
        var isRecording = false;
        var micPermissionGranted = false;
        
        // Whisper (OpenAI) speech recognition variables
        var mediaRecorder = null;
        var audioChunks = [];
        var whisperStream = null;
        var isTranscribing = false;
        var AUTO_SEND = true;  // Auto-send transcription when recording stops

        // Pre-warm microphone permission on first use
        async function ensureMicPermission() {
            if (micPermissionGranted) {
                return true;
            }
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                micPermissionGranted = true;
                console.log('Microphone permission granted');
                return true;
            } catch (err) {
                console.error('Microphone permission denied:', err);
                alert('Microphone access is required for voice input. Please allow microphone access in your browser settings.');
                return false;
            }
        }

        // Start recording with MediaRecorder (OpenAI Whisper)
        async function startWhisperRecording() {
            if (isRecording || isTranscribing) {
                console.log('Already recording or transcribing, ignoring start request');
                return;
            }
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                whisperStream = stream;
                audioChunks = [];
                
                // Try to use webm/opus format (supported by Chrome/Brave)
                let mimeType = 'audio/webm;codecs=opus';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'audio/webm';
                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = 'audio/mp4';
                        if (!MediaRecorder.isTypeSupported(mimeType)) {
                            mimeType = '';
                        }
                    }
                }
                
                const options = mimeType ? { mimeType: mimeType } : {};
                mediaRecorder = new MediaRecorder(stream, options);
                
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async function() {
                    console.log('MediaRecorder stopped, transcribing...');
                    isTranscribing = true;
                    document.getElementById('mic-button').classList.add('transcribing');
                    
                    // Stop all tracks
                    if (whisperStream) {
                        whisperStream.getTracks().forEach(track => track.stop());
                        whisperStream = null;
                    }
                    
                    // Create blob from chunks
                    const audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
                    audioChunks = [];
                    
                    // Send to server for transcription
                    try {
                        const formData = new FormData();
                        formData.append('audio', audioBlob, 'speech.webm');
                        
                        const response = await fetch('/api/transcribe', {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (!response.ok) {
                            const errorData = await response.json();
                            throw new Error(errorData.error || 'Transcription failed');
                        }
                        
                        const data = await response.json();
                        const text = (data.text || '').trim();
                        
                        if (text) {
                            document.getElementById('user-input').value = text;
                            console.log('Transcription successful:', text);
                            
                            // Auto-send if enabled
                            if (AUTO_SEND) {
                                sendUserInput();
                            }
                        } else {
                            console.log('No speech detected in transcription');
                            alert('No speech detected. Please try again.');
                        }
                    } catch (err) {
                        console.error('Transcription error:', err);
                        alert('Transcription failed: ' + err.message + '\n\nMake sure OPENAI_API_KEY is set on the server.');
                    } finally {
                        isTranscribing = false;
                        document.getElementById('mic-button').classList.remove('transcribing');
                    }
                };
                
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('mic-button').classList.add('recording');
                console.log('Whisper recording started');
                
            } catch (err) {
                console.error('Failed to start Whisper recording:', err);
                alert('Failed to start recording: ' + err.message);
                isRecording = false;
            }
        }

        // Stop recording
        function stopWhisperRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('mic-button').classList.remove('recording');
                console.log('Stopping Whisper recording...');
            }
        }

        // Setup mic button push-to-talk event handlers
        document.addEventListener('DOMContentLoaded', function() {
            const micButton = document.getElementById('mic-button');
            
            async function startIfPossible(e) {
                e.preventDefault();
                if (!isRecording && !isTranscribing) {
                    const hasPermission = await ensureMicPermission();
                    if (hasPermission) {
                        await startWhisperRecording();
                    }
                }
            }
            
            function stopIfRecording(e) {
                e.preventDefault();
                if (isRecording) {
                    stopWhisperRecording();
                }
            }
            
            // Mouse events
            micButton.addEventListener('mousedown', startIfPossible);
            micButton.addEventListener('mouseup', stopIfRecording);
            micButton.addEventListener('mouseleave', stopIfRecording);
            
            // Touch events for mobile
            micButton.addEventListener('touchstart', startIfPossible, {passive: false});
            micButton.addEventListener('touchend', stopIfRecording);
            micButton.addEventListener('touchcancel', stopIfRecording);
        });

        // Spacebar hotkey for speech input (hold to talk, release to stop)
        var spacebarPressed = false;
        var spacebarStartTime = 0;
        
        document.addEventListener('keydown', function(e) {
            // Only activate if spacebar is pressed and textarea is NOT focused
            if (e.code === 'Space' && document.activeElement.id !== 'user-input' && !spacebarPressed) {
                e.preventDefault();
                spacebarPressed = true;
                spacebarStartTime = Date.now();
                
                if (!isRecording && !isTranscribing) {
                    // Use async function to handle permission check
                    (async function() {
                        const hasPermission = await ensureMicPermission();
                        if (!hasPermission) {
                            spacebarPressed = false;
                            return;
                        }
                        
                        await startWhisperRecording();
                    })();
                }
            }
        });

        document.addEventListener('keyup', function(e) {
            // Stop recording when spacebar is released
            if (e.code === 'Space' && spacebarPressed) {
                e.preventDefault();
                var pressDuration = Date.now() - spacebarStartTime;
                
                // Only stop if key was held for at least 150ms to avoid accidental quick taps
                if (pressDuration >= 150 && isRecording) {
                    stopWhisperRecording();
                }
                
                spacebarPressed = false;
            }
        });

        socket.on('connect', function() {
            console.log('Websocket connected!');
        });

        socket.on('update_thoughts', function(data) {
            var element = document.getElementById('assistant-thoughts');
            if (!thoughtsInitialized) {
                element.innerHTML = '';
                thoughtsInitialized = true;
            }
            element.innerHTML += '<div class="thought-msg">' + data.data.replace(/\n/g, '<br>') + '</div>';
            element.scrollTop = element.scrollHeight;
        });

        socket.on('update_speech', function(data) {
            var element = document.getElementById('chat-history');
            if (!chatHistoryInitialized) {
                element.innerHTML = '';
                chatHistoryInitialized = true;
            }
            element.innerHTML += '<div class="speech-msg">' + data.data.replace(/\n/g, '<br>') + '</div>';
            element.scrollTop = element.scrollHeight;
        });

        socket.on('update_user_input', function(data) {
            var element = document.getElementById('chat-history');
            if (!chatHistoryInitialized) {
                element.innerHTML = '';
                chatHistoryInitialized = true;
            }
            element.innerHTML += '<div class="user-msg">' + data.data.replace(/\n/g, '<br>') + '</div>';
            element.scrollTop = element.scrollHeight;
        });

        function sendUserInput() {
            var userInput = document.getElementById('user-input').value.trim();
            if (userInput) {
                // socket.emit('user_input', {data: userInput}, '/chat');
                socket.emit('user_input', {data: userInput});
                document.getElementById('user-input').value = '';
            }
        }

        // Allow Enter key to send (Shift+Enter for new line)
        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendUserInput();
            }
        });

        document.getElementById('toggle-thoughts').addEventListener('click', function() {
            var thoughtsSidebar = document.getElementById('assistant-thoughts-section');
            var toggleText = document.getElementById('toggle-text');
            thoughtsSidebar.classList.toggle('collapsed');
            toggleText.innerText = thoughtsSidebar.classList.contains('collapsed') ? 'Show Thoughts' : 'Hide Thoughts';
        });
    </script>
</body>
</html>
